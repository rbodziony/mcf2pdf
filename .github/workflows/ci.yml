name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress "-Djava.awt.headless=true" verify

      - name: Test release automation
        run: python -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            target/*.jar
            target/*-bin-linux.tar.gz
            target/*-bin-windows.zip
            target/*-src.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_version.py

      - name: Download tested build artifacts
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: gh run download "$GITHUB_RUN_ID" --name build-ubuntu-latest --dir release-assets

      - name: Generate release notes with all commits
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_notes.py

      - name: Create or update GitHub Release
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/mcf2pdf-${RELEASE_VERSION}.jar"
            "release-assets/mcf2pdf-${RELEASE_VERSION}-bin-linux.tar.gz"
            "release-assets/mcf2pdf-${RELEASE_VERSION}-bin-windows.zip"
            "release-assets/mcf2pdf-${RELEASE_VERSION}-src.tar.gz"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_VERSION" --notes-file release-notes.md
          fi
